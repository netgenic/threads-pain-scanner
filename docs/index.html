<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Pain Scanner</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .features {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .feature {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
        }

        .feature-icon {
            font-size: 1.5rem;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--accent);
            border-radius: 8px;
            transition: all 0.2s;
        }

        a:hover {
            background: var(--accent);
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🔍</div>
        <h1>Threads Pain Scanner</h1>
        <p class="tagline">Market research tool for analyzing user pain points on Threads</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div>Keyword Search</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div>AI Analysis</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💡</div>
                <div>App Ideas</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div>Export Data</div>
            </div>
        </div>

        <div class="links">
            <a href="https://github.com/netgenic/threads-pain-scanner">GitHub</a>
            <a href="privacy-policy.html">Privacy Policy</a>
        </div>
    </div>
</body>

</html>
